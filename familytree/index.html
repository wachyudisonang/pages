<title>Family Tree</title>
<meta name="app-version" content="202610271324" />

<script>
  (function(){
    try{
      var t=localStorage.getItem('APP_theme'); if(t==='light'||t==='dark'){ document.documentElement.setAttribute('data-theme',t); }
      var l=localStorage.getItem('APP_lang'); document.documentElement.setAttribute('lang', (l==='en'||l==='id')?l:'id');
      var id=null; try{ id=JSON.parse(localStorage.getItem('ft.identity.v1')||'null'); }catch(_){}
      var deepLink=/[?&](intro|me|focus)=/.test(location.search);
      if(!(id&&id.personId)&&!deepLink){ document.documentElement.classList.add('ft-gating'); }
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="style.css?v=202610271324">
</head>
<body>

<div class="app">

  <header class="top">
    <h1>
      
      <a class="brand" href="./" aria-label="Family Tree home">

      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>

    <div id="desktop-view" class="hidden md:block">
      <div id="ft-stage-wrap" class="full-bleed py-6">
        <div class="container-wide">
          <div id="ft-controls" class="card-row"></div>
          <div class="ft-stage"></div>
        </div>
      </div>
      <div id="ft-block-info" class="full-bleed py-6">
        <div class="container-wide">
          <button type="button" id="ft-edit-family-v2">Edit Family</button>
        </div>
      </div>
    </div>

    <div id="mobile-view" class="md:hidden">
      <div id="mobile-stage-wrap" class="full-bleed py-6">
        <div class="container-wide">
          <div class="ft-stage"></div>
        </div>
      </div>
    </div>

    <div id="ft-viewer"></div>

  </main>

  <nav class="tabs" id="tabs">

        <span class="lbl2" data-i18n="nav.more">Admin</span>
        <span class="nav-dd-caret" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </button>
      <div class="nav-dd-menu" id="ftAdminDdMenu" role="menu">
        <a href="?switchFamily" role="menuitem" data-ft-admin="switchFamily">Switch Family</a>
        <a href="?pending" role="menuitem" data-ft-admin="pending">Pending review</a>
        <a href="?possibleMe" role="menuitem" data-ft-admin="possibleMe">possibleMe</a>
        <a href="?visitors" role="menuitem" data-ft-admin="visitors">Visitors log</a>
      </div>
    </div>
  </nav>
  
  <div class="nav-scrim" id="navScrim" hidden></div>

  <nav class="botbar" aria-label="Quick navigation">
    <button class="botbar-btn" data-tab="home">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span class="lbl2" data-i18n="nav.home">Home</span>

    <button class="botbar-btn" data-tab="more">

      <span class="lbl2" data-i18n="nav.more">More</span>
    </button>

</div>

<div class="modal-bg" id="modalBg" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">

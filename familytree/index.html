<script>
  (function(){
    try{
      var t=localStorage.getItem('APP_theme'); if(t==='light'||t==='dark'){ document.documentElement.setAttribute('data-theme',t); }
      var l=localStorage.getItem('APP_lang'); document.documentElement.setAttribute('lang', (l==='en'||l==='id')?l:'id');
      var id=null; try{ id=JSON.parse(localStorage.getItem('ft.identity.v1')||'null'); }catch(_){}
      var deepLink=/[?&](intro|me|focus)=/.test(location.search);
      document.documentElement.classList.add((!(id&&id.personId)&&!deepLink)?'ft-gating':'ft-booting');
    }catch(e){}
  })();
</script>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wachyudi · Projects</title>
  <meta name="description" content="A small hub of personal web projects." />
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #222631;
      --text: #e7e9ee;
      --muted: #9aa0ac;
      --accent: #5b8def;
      --border: #2a2e38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 1.9rem; margin: 0 0 8px; font-weight: 600; }
    header p { color: var(--muted); margin: 0; font-size: 0.98rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 860px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 22px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card .emoji { font-size: 1.8rem; }
    .card h2 { font-size: 1.15rem; margin: 4px 0 0; font-weight: 600; }
    .card p { color: var(--muted); margin: 0; font-size: 0.9rem; line-height: 1.45; }
    .card .go {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
    }
    footer { margin-top: 44px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Projects</h1>
    <p>A small hub of personal web apps.</p>
  </header>

  <main class="grid">
    <a class="card" href="./masak-apa/?v=202610040859">
      <span class="emoji">🍳</span>
      <h2>Masak Apa Hari Ini?</h2>
      <p>Pemilih menu masakan Indonesia harian, dengan referensi komunitas.</p>
      <span class="go">Buka →</span>
    </a>

    <a class="card" href="./sentralingua-v2/?v=202610040859">
      <span class="emoji">🗣️</span>
      <h2>Sentralingua v2</h2>
      <p>Sentralingua redesign.</p>
      <span class="go">Buka →</span>
    </a>

    <a class="card" href="./grocery/?v=202610050253">
      <span class="emoji">🛒</span>
      <h2>Daftar Belanja</h2>
      <p>Daftar belanja offline dengan riwayat harga barang.</p>
      <span class="go">Buka →</span>
    </a>
  </main>

  <footer>Hosted on GitHub Pages</footer>
</body>
</html>

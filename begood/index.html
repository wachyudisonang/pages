<section class="vault-gate" id="vaultGate" aria-labelledby="vaultTitle">
  <div class="vault-card">
    <div class="vault-mark" aria-hidden="true"><!-- logo:use:start --><svg viewBox="62 66 237.49 277.57" aria-hidden="true"><use href="#bgLogoMark"/></svg><!-- logo:use:end --></div>
    <h1 id="vaultTitle" data-i18n="vault.title"></h1>
    <p class="cursect" id="gateAccount" hidden></p>
    <div id="vaultSetup" hidden>
      <h2 data-i18n="vault.setup"></h2>
      <p class="hint" data-i18n="vault.setupHint"></p>
      <form id="vaultSetupForm">
        <label class="field">
          <span class="field-lbl" data-i18n="vault.passphrase"></span>
          <span class="pw-field"><input id="vaultSetupPassphrase" type="password" minlength="12" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false" data-toggle-password data-i18n-aria="vault.togglePassphrase"><svg class="pw-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5.2M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></span>
        </label>
        <label class="field">
          <span class="field-lbl" data-i18n="vault.confirm"></span>
          <span class="pw-field"><input id="vaultSetupConfirm" type="password" minlength="12" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false" data-toggle-password data-i18n-aria="vault.togglePassphrase"><svg class="pw-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5.2M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></span>
        </label>
        <button class="btn mt-4" type="submit" data-i18n="vault.create"></button>
      </form>
    </div>
    <div id="cloudSignIn" hidden>
      <h2 id="cloudSignInTitle" data-i18n="vault.signIn"></h2>
      <p class="hint" id="cloudSignInHint" data-i18n="vault.signInHint"></p>
      <button class="btn mt-4" id="cloudSignInButton" type="button" data-i18n="vault.signInButton"></button>
    </div>
    <div id="vaultUnlock" hidden>
      <h2 data-i18n="vault.unlock"></h2>
      <p class="hint" data-i18n="vault.unlockHint"></p>
      <form id="vaultUnlockForm">
        <label class="field">
          <span class="field-lbl" data-i18n="vault.passphrase"></span>
          <span class="pw-field"><input id="vaultUnlockPassphrase" type="password" minlength="12" autocomplete="current-password" required><button class="pw-toggle" type="button" aria-pressed="false" data-toggle-password data-i18n-aria="vault.togglePassphrase"><svg class="pw-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5.2M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></span>
        </label>
        <button class="btn mt-4" type="submit" data-i18n="vault.open"></button>
      </form>
      <button class="btn ghost mt-3" id="forgotPassphraseButton" type="button" data-i18n="vault.forgot"></button>
    </div>
    <div id="vaultRecover" hidden>
      <h2 data-i18n="vault.recoverTitle"></h2>
      <p class="hint" data-i18n="vault.recoverHint"></p>
      <form id="vaultRecoverForm">
        <label class="field">
          <span class="field-lbl" data-i18n="vault.recoverCode"></span>
          <input id="recoverCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        </label>
        <label class="field">
          <span class="field-lbl" data-i18n="settings.passphraseNew"></span>
          <span class="pw-field"><input id="recoverNew" type="password" minlength="12" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false" data-toggle-password data-i18n-aria="vault.togglePassphrase"><svg class="pw-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5.2M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></span>
        </label>
        <label class="field">
          <span class="field-lbl" data-i18n="vault.confirm"></span>
          <span class="pw-field"><input id="recoverConfirm" type="password" minlength="12" autocomplete="new-password" required><button class="pw-toggle" type="button" aria-pressed="false" data-toggle-password data-i18n-aria="vault.togglePassphrase"><svg class="pw-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="pw-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.1-5.2M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button></span>
        </label>
        <button class="btn mt-4" id="recoverButton" type="submit" data-i18n="vault.recoverSave"></button>
      </form>
      <button class="btn ghost mt-3" id="recoverBackButton" type="button" data-i18n="vault.recoverBack"></button>
    </div>
    <button class="btn ghost mt-3" id="restoreCloudButton" type="button" data-i18n="vault.restoreCloud"></button>
    <p class="form-error" id="vaultError" role="alert"></p>
  </div>
</section>

<div class="app with-botbar" id="appRoot" hidden>
  <header class="top">
    <h1>
      <a class="brand" href="./" data-i18n-aria="a11y.home">
        <span class="logo" aria-hidden="true"><!-- logo:use:start --><svg viewBox="62 66 237.49 277.57" aria-hidden="true"><use href="#bgLogoMark"/></svg><!-- logo:use:end --></span>
        <span data-i18n="app.name"></span>
      </a>
    </h1>
    <span class="app-subtitle" data-i18n="app.subtitle"></span>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="tabs" data-i18n-aria="a11y.menu">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </header>

  <main>
    <section class="tab on" data-view="summary">
      <div class="container-wide">
        <div class="page-heading">
          <div>
            <div class="sectitle" data-i18n="summary.title"></div>
            <h2 id="summaryYear"></h2>
          </div>
          <button class="btn sm" type="button" data-tab="record" data-i18n="transactions.add"></button>
        </div>
        <div class="metric-grid">
          <article class="card metric income"><span data-i18n="summary.income"></span><strong id="summaryIncome"></strong></article>
          <article class="card metric expense"><span data-i18n="summary.expense"></span><strong id="summaryExpense"></strong></article>
          <article class="card metric"><span data-i18n="summary.cashflow"></span><strong id="summaryCashflow"></strong></article>
          <article class="card metric"><span data-i18n="summary.eligible"></span><strong id="summaryEligible"></strong></article>
          <article class="card metric accent"><span data-i18n="summary.estimate"></span><strong id="summaryEstimate"></strong></article>
          <article class="card metric"><span data-i18n="summary.paid"></span><strong id="summaryPaid"></strong></article>
          <article class="card metric"><span data-i18n="summary.remaining"></span><strong id="summaryRemaining"></strong></article>
        </div>
        <div class="empty mt-4" id="summaryEmpty" hidden data-i18n="summary.empty"></div>
        <div class="sectitle" data-i18n="wallet.summaryTitle"></div>
        <div class="wallet-cards" id="walletCards" hidden></div>
        <div class="empty" id="walletCardsEmpty" hidden>
          <p class="hint" data-i18n="wallet.summaryEmpty"></p>
          <button class="btn sm mt-3" type="button" data-tab="wallets" data-i18n="wallet.open"></button>
        </div>
      </div>
    </section>

    <section class="tab" data-view="transactions">
      <div class="container-wide">
        <div class="page-heading">
          <h2 data-i18n="transactions.title"></h2>
          <div class="page-actions">
            <button class="btn sm" type="button" id="trashButton" data-tab="trash" hidden data-i18n="transactions.trash"></button>
            <button class="btn sm" type="button" data-tab="record" data-i18n="transactions.add"></button>
          </div>
        </div>
        <div class="sync-note" id="syncNote" hidden>
          <span id="syncNoteText"></span>
          <button class="btn sm" type="button" id="syncNoteButton" data-i18n="sync.now"></button>
        </div>
        <div class="wallet-filter" id="walletFilter" hidden>
          <span id="walletFilterText"></span>
          <button class="btn sm ghost" type="button" id="walletFilterClear" data-i18n="wallet.showAll"></button>
        </div>
        <div class="table-wrap" id="transactionTable" hidden>
          <table class="ledger">
            <thead>
              <tr>
                <th data-i18n="transaction.date"></th>
                <th data-i18n="transaction.category"></th>
                <th data-i18n="transaction.wallet"></th>
                <th data-i18n="transaction.description"></th>
                <th class="num" data-i18n="transactions.income"></th>
                <th class="num" data-i18n="transactions.expense"></th>
                <th data-i18n="transactions.actions"></th>
              </tr>
            </thead>
            <tbody id="transactionList"></tbody>
          </table>
        </div>
        <div class="ledger-cards" id="ledgerCards" hidden></div>
        <div class="empty" id="transactionEmpty" data-i18n="transactions.empty"></div>
      </div>
    </section>

    <section class="tab" data-view="trash">
      <div class="container-wide">
        <button class="btn sm ghost" type="button" data-tab="transactions" data-i18n="trash.back"></button>
        <div class="page-heading">
          <h2 data-i18n="transactions.trash"></h2>
          <div class="page-actions">
            <button class="btn sm" type="button" id="trashRestoreAll" data-i18n="trash.restoreAll"></button>
            <button class="btn sm danger" type="button" id="trashDeleteAll" data-i18n="trash.deleteAll"></button>
          </div>
        </div>
        <p class="hint" id="trashHint"></p>
        <div class="transaction-list" id="trashList"></div>
        <div class="empty" id="trashEmpty" hidden data-i18n="trash.empty"></div>
      </div>
    </section>

    <section class="tab" data-view="wallets">
      <div class="container-wide">
        <div class="page-heading">
          <h2 data-i18n="wallet.title"></h2>
          <div class="page-actions">
            <button class="btn sm" type="button" id="walletNew" data-i18n="wallet.add"></button>
          </div>
        </div>
        <p class="hint" data-i18n="wallet.hint"></p>
        <div class="transaction-list" id="walletList" hidden></div>
        <div class="empty" id="walletEmpty" hidden data-i18n="wallet.empty"></div>
        <form class="card mt-4 form-grid" id="walletForm">
          <h2 id="walletFormTitle" class="form-wide" data-i18n="wallet.formNew"></h2>
          <label class="field"><span class="field-lbl" data-i18n="wallet.storage"></span><span class="combo"><input id="walletStorage" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="walletStorageList" maxlength="80" autocomplete="off" required><span class="combo-list" id="walletStorageList" role="listbox" hidden></span></span></label>
          <label class="field"><span class="field-lbl" data-i18n="wallet.name"></span><span class="combo"><input id="walletName" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="walletNameList" maxlength="80" autocomplete="off" required><span class="combo-list" id="walletNameList" role="listbox" hidden></span></span></label>
          <label class="field"><span class="field-lbl" data-i18n="wallet.holder"></span><span class="combo"><input id="walletHolder" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="walletHolderList" maxlength="80" autocomplete="off" required><span class="combo-list" id="walletHolderList" role="listbox" hidden></span></span></label>
          <label class="field"><span class="field-lbl" data-i18n="wallet.accountNumber"></span><input id="walletAccountNumber" maxlength="80" inputmode="numeric" autocomplete="off"></label>
          <label class="field"><span class="field-lbl" data-i18n="wallet.phone"></span><span class="combo"><input id="walletPhoneNumber" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="walletPhoneList" maxlength="80" inputmode="tel" autocomplete="off"><span class="combo-list" id="walletPhoneList" role="listbox" hidden></span></span></label>
